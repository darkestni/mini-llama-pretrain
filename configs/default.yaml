# MiniLlama-Pretrain 默认配置

model:
  # MiniLlama: 缩小版 Llama 架构，~100M 参数
  # 与标准 Llama 同架构，只是缩小到单卡可训
  arch:
    vocab_size: 151643        # Qwen2.5 tokenizer 词表大小
    hidden_size: 576          # 隐藏维度（缩小以控制总参数量）
    intermediate_size: 1536   # FFN 中间维度
    num_hidden_layers: 6      # 层数
    num_attention_heads: 9    # 注意力头数（576/9=64 每头）
    num_key_value_heads: 9    # KV 头数
    max_position_embeddings: 512  # 上下文长度
    rms_norm_eps: 1.0e-6
    rope_theta: 10000.0
    tie_word_embeddings: true
  # 理论参数量约 ~100M（含 embedding）

tokenizer:
  # 复用 Qwen2.5 tokenizer（不重新训 tokenizer）
  name: "Qwen/Qwen2.5-0.5B"

data:
  # 数据来源：wikipedia（真实预训练数据，无标注）
  source: "wikipedia"         # wikipedia / sample
  language: "zh"              # zh / en（wikipedia 子集语言）
  max_length: 512             # 打包的 token 块长度
  num_samples: 50000          # 用多少条 wikipedia 文章（None=全部）
  cache_dir: "data/cache"

train:
  output_dir: "outputs/pretrain_run"
  # 训练超参
  learning_rate: 3.0e-4       # 预训练用比微调更大的 lr
  warmup_ratio: 0.05
  weight_decay: 0.1
  max_steps: 50000            # 总训练步数（集群上可调大）
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4   # 等效 batch = 64
  save_steps: 2000
  logging_steps: 50
  # 优化
  adam_beta1: 0.9
  adam_beta2: 0.95            # 预训练常用 0.95
  gradient_checkpointing: true
  fp16: false
  bf16: true                  # 集群 A100/H100 支持 bf16

eval:
  # 评测
  num_generate_samples: 5     # 生成多少条对比样本
  eval_steps: 2000            # 训练中每隔多少步评测困惑度

run:
  seed: 42
